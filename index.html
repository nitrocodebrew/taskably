<!DOCTYPE html>
<html lang="en-US">
<head>
    
    <meta charset="utf-8">

    <title>Taskably</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="To-Do/task list management app powered by JavaScript.">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>

</head>
<body>
    <header class="page-header">
        <div class="container page-header-container">
            <h1>Taskably</h1>

            <div class="task-form">
                <input type="text" class="task" placeholder="What's on the agenda today?"> 
                <button type="button" class="create-task">Add +</button>
            </div>
        </div>
    </header>
    <main class="page-content">
        <div class="container page-content-container">
            <div class="empty-list-placeholder">
                <span class="empty-list-label">Make today a productive one!</span>
            </div>

            <div class="task-list">
                <ul>
                    
                </ul>
            </div>
        </div>
    </main>
    <footer class="page-footer">
        <div class="container page-footer-container">
            <p class="project-source-code">
                The source code for this project can be found on <a href="https://github.com/nitrocodebrew/taskably" class="github-repo-link" target="_blank" rel="noopener noreferrer">GitHub</a>.
            </p>
        </div>
    </footer>
</body>
</html>
